name: Release

# Two doors in, one artifact out:
#   - the train's own hand-off: when Tag the version finishes, the tag it
#     just cut is the release. A tag pushed by a workflow's token does
#     not start workflows on its own — that is GitHub keeping runs from
#     recursing — so the hand-off rides the finished run instead.
#   - a tag cut by hand, pushed the ordinary way.
#
# Either way the version is established before anything is built: the
# hand-cut door checks the code says the same number as the tag, and the
# train's door takes the tag job's word for it — the tag was cut from
# that code. The build then walks the width of that code — one publish
# for every runtime the editor stands on, Windows, Linux and macOS each
# in AMD64 and ARM64, over the three ordinary runners, the two arms of a
# family crossing only architectures and never systems. The six archives
# are then gathered once, laid beside their checksums, and handed to the
# release whole: it replaces whatever the names already hold, so a rerun
# is an upload, not an error.
on:
  workflow_run:
    workflows: ["Tag the version"]
    types: [completed]
  push:
    tags: ["v*"]

permissions:
  contents: write

# One release at a time. Two runs racing the same tag would both be
# writing the same names, and neither would end up the whole truth.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The number, before anything else. Every job below stands on this one,
  # so a failed door here — a tag that disagrees with the code it was cut
  # from, a tag job that did not finish — stops the whole walk with no
  # bytes fetched and no release touched.
  version:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # The train's door: the commit the tag was cut from. The
          # hand-cut door: the tag itself, which is the checkout default.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Establish the version
        id: version
        shell: pwsh
        env:
          # The hand-cut door's tag, as a variable rather than spliced into
          # the script: a tag is a name a person chose, and names do not go
          # into code.
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run') {
            $version = [regex]::Match(
              (Get-Content Shiranux/Shiranuix/Shiranuix.csproj -Raw),
              '<Version>([\d.]+)</Version>').Groups[1].Value
            "tag=v$version" | Out-File -Append $env:GITHUB_OUTPUT
            "releasing Shiranuix $version, from the finished tag job"
          } else {
            $version = $env:REF_NAME -replace '^v', ''
            $inCode = [regex]::Match(
              (Get-Content Shiranux/Shiranuix/Shiranuix.csproj -Raw),
              '<Version>([\d.]+)</Version>').Groups[1].Value
            if ($inCode -ne $version) {
              "tag says $version but the project file says $inCode"
              exit 1
            }
            $env:REF_NAME | Out-File -Append $env:GITHUB_OUTPUT
            "releasing Shiranuix $version"
          }

          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT

  # The honest test run, over the width of the release. CI has walked
  # this code on three systems if it came through a pull request — but
  # the hand-cut door may point at a commit that never saw a pull request
  # at all, and no archive goes out before each of the three systems the
  # release is cut for has built the code and let the suite speak.
  verify:
    needs: version

    strategy:
      # Every system is worth its own answer: one failing must not
      # silence the two still speaking.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # The same commit the version job read its number from.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Shiranuix.slnx -warnaserror

      - name: Test
        run: dotnet test Shiranuix.slnx --no-build

  # One publish per runtime. Each line names an archive, the ordinary
  # runner that builds it, and the program file the archive holds — the
  # executable wears .exe only on Windows. The two arms of a family share
  # that family's runner: the cross-architecture compile is the SDK's own
  # work, while an operating system left behind for a cheaper one would be
  # somebody else's assumptions in the bytes.
  publish:
    needs: [version, verify]

    strategy:
      # A leg that fails must not silence the five still speaking: the
      # release below waits for all six or says nothing at all.
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
            program: Shiranuix.exe
          - rid: win-arm64
            runner: windows-latest
            program: Shiranuix.exe
          - rid: linux-x64
            runner: ubuntu-latest
            program: Shiranuix
          - rid: linux-arm64
            runner: ubuntu-latest
            program: Shiranuix
          - rid: osx-x64
            runner: macos-latest
            program: Shiranuix
          - rid: osx-arm64
            runner: macos-latest
            program: Shiranuix

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # The same commit the version job read its number from.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish a self-contained single file
        run: >
          dotnet publish Shiranux/Shiranuix/Shiranuix.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $asset = "Shiranuix-$version-${{ matrix.rid }}.zip"
          Compress-Archive "publish/${{ matrix.program }}" $asset
          Get-FileHash $asset -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash |
            ForEach-Object { "sha256 ($_ for $asset)" }

      - uses: actions/upload-artifact@v4
        with:
          name: Shiranuix-${{ matrix.rid }}
          path: Shiranuix-*.zip
          if-no-files-found: error

  # The six archives, one checksum file, one release. Nothing here builds;
  # this job only gathers what every leg above had to agree on — a release
  # that shipped six archives after five were proven would be lying about
  # what went out — names their hashes in the run's log as the single-file
  # build always did, and hands the whole set to the release, replacing
  # any name already there.
  release:
    needs: [version, publish]
    runs-on: ubuntu-latest

    steps:
      # The gather needs a house before it can ask gh anything: gh calls
      # out to git to learn which repository it stands in before it will
      # read or write a release, and a bare folder of downloaded
      # artifacts answers that question with nothing — which is how the
      # first run of this file lost its release at the last step.
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # The same commit the version job read its number from.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Take every archive the matrix made
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Name the checksums of all six
        working-directory: assets
        run: |
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: assets
        run: |
          if gh release view "$TAG" --json tagName --jq .tagName >/dev/null 2>&1; then
            gh release upload "$TAG" ./*.zip ./SHA256SUMS.txt --clobber
            echo "assets uploaded to the existing $TAG"
          else
            gh release create "$TAG" ./*.zip ./SHA256SUMS.txt \
              --title "Shiranuix $VERSION" --generate-notes
            echo "release created: $TAG"
          fi

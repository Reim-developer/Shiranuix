name: Release

# Two doors in, one artifact out:
#   - the train's own hand-off: when Tag the version finishes, the tag it
#     just cut is the release. A tag pushed by a workflow's token does
#     not start workflows on its own — that is GitHub keeping runs from
#     recursing — so the hand-off rides the finished run instead.
#   - a tag cut by hand, pushed the ordinary way.
#
# Either way the version is established before anything is built: the
# hand-cut door checks the code says the same number as the tag, and
# the train's door takes the tag job's word for it — the tag was cut
# from that code. The release then replaces the asset if the name is
# already taken, so a rerun is an upload, not an error.
on:
  workflow_run:
    workflows: ["Tag the version"]
    types: [completed]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # The train's door: the commit the tag was cut from. The
          # hand-cut door: the tag itself, which is the checkout default.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Establish the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run') {
            $version = [regex]::Match(
              (Get-Content Shiranux/Shiranuix/Shiranuix.csproj -Raw),
              '<Version>([\d.]+)</Version>').Groups[1].Value
            "tag=v$version" | Out-File -Append $env:GITHUB_OUTPUT
            "releasing Shiranuix $version, from the finished tag job"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
            $inCode = [regex]::Match(
              (Get-Content Shiranux/Shiranuix/Shiranuix.csproj -Raw),
              '<Version>([\d.]+)</Version>').Groups[1].Value
            if ($inCode -ne $version) {
              "tag says $version but the project file says $inCode"
              exit 1
            }
            "${{ github.ref_name }}" | Out-File -Append $env:GITHUB_OUTPUT
            "releasing Shiranuix $version"
          }

          "version=$version" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test Shiranuix.slnx

      - name: Publish a self-contained single file
        run: >
          dotnet publish Shiranux/Shiranuix/Shiranuix.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive publish/Shiranuix.exe "Shiranuix-$version-win-x64.zip"
          Get-FileHash "Shiranuix-$version-win-x64.zip" -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash |
            ForEach-Object { "sha256: $_" }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $asset = "Shiranuix-$version-win-x64.zip"

          $existing = gh release view $tag --json tagName --jq .tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber
            "asset uploaded to the existing $tag"
          } else {
            gh release create $tag $asset --title "Shiranuix $version" --generate-notes
            "release created: $tag"
          }

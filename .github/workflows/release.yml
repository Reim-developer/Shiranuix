name: Release

# Two doors in, one artifact out:
#   - the train's own hand-off: when Tag the version finishes, the tag it
#     just cut is the release. A tag pushed by a workflow's token does
#     not start workflows on its own — that is GitHub keeping runs from
#     recursing — so the hand-off rides the finished run instead.
#   - a tag cut by hand, pushed the ordinary way.
#
# Either way the first thing done is checking the code under the tag
# says the same number: a tag and a repository that disagree are not a
# thing to build from.
on:
  workflow_run:
    workflows: ["Tag the version"]
    types: [completed]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest

    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          # The train's door: the commit the tag was cut from. The
          # hand-cut door: the tag itself, which is the checkout default.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: The tag and the code say the same version
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_run') {
            # The tag job cut the tag from this code's version, so the code
            # is the release; the event carries no tag name to check.
            $version = [regex]::Match(
              (Get-Content Shiranuix/Shiranuix.csproj -Raw),
              '<Version>([\d.]+)</Version>').Groups[1].Value
            "releasing Shiranuix $version, from the finished tag job"
          } else {
            $version = "${{ github.ref_name }}" -replace '^v', ''
            $inCode = [regex]::Match(
              (Get-Content Shiranuix/Shiranuix.csproj -Raw),
              '<Version>([\d.]+)</Version>').Groups[1].Value
            if ($inCode -ne $version) {
              "tag says $version but the project file says $inCode"
              exit 1
            }
            "releasing Shiranuix $version"
          }

      - name: Test
        run: dotnet test Shiranuix.slnx

      - name: Publish a self-contained single file
        run: >
          dotnet publish Shiranuix/Shiranuix.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Compress-Archive publish/Shiranuix.exe "Shiranuix-$version-win-x64.zip"
          Get-FileHash "Shiranuix-$version-win-x64.zip" -Algorithm SHA256 |
            Select-Object -ExpandProperty Hash |
            ForEach-Object { "sha256: $_" }

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          "Shiranuix-${{ github.ref_name }}-win-x64.zip"
          --title "Shiranuix ${{ github.ref_name }}"
          --generate-notes
          --clobber

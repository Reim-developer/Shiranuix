name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Shiranuix.slnx -warnaserror

      - name: Test
        run: dotnet test Shiranuix.slnx --no-build

      - name: Format
        run: dotnet format Shiranuix.slnx --verify-no-changes

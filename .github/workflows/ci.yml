name: CI

# Runs on the integration branch and on every pull request aimed at dev or
# main. A green run here is what lets a pull request be merged — the main
# branch's protection requires these jobs, so nothing reaches a release
# number that has not built, tested, formatted and cleared the guards.
#
# The build walks the three systems a release is cut for — Windows, Linux
# and macOS — because a change that only builds on the runner it was
# written on says nothing about the other two; the tests ride the same
# legs, headless windows among them, none of which needs a display. Each
# leg then publishes the file its own system's release would carry and
# stands that up headless too, which is the only proof the artifact itself
# can give. The guards and the formatter keep one machine's opinion
# instead: they read the repository's own text, and text is where two
# systems disagree first.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      # Every leg is worth its own answer: one system failing must not
      # silence the report of the two still speaking.
      fail-fast: false
      matrix:
        # Each leg stands for the system it runs on, and carries the shape
        # a release for that system would be packed in: the RID to publish
        # for, and the name the published file goes by there.
        include:
          - os: ubuntu-latest
            rid: linux-x64
            program: Shiranuix
          - os: windows-latest
            rid: win-x64
            program: Shiranuix.exe
          - os: macos-latest
            rid: osx-arm64
            program: Shiranuix

    runs-on: ${{ matrix.os }}

    # A smoke that hangs must not wait out the platform's own patience —
    # hours — before anybody learns it never answered.
    timeout-minutes: 30

    steps:
      # The repository's files are stored with LF endings; a Windows runner
      # would otherwise hand the build CRLF copies and make a lie of the
      # guards below.
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build Shiranuix/Shiranuix.slnx -warnaserror

      - name: Test
        run: dotnet test Shiranuix/Shiranuix.slnx --no-build

      # The artifact answering for itself. The steps above prove the code
      # on this system; this proves the shipped file — every native piece
      # bundled into it — standing itself up headless on the runner's own
      # system, drawing one frame and reading one paper before it says so.
      - name: Publish what a release would carry
        run: >
          dotnet publish Shiranuix/Shiranuix/Shiranuix.csproj
          -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o smoke

      - name: Stand it up without a screen
        shell: pwsh
        run: |
          $env:SHIRANUIX_HOME = Join-Path $env:RUNNER_TEMP "shiranuix-smoke"
          # Waited on by hand: a windowed program is not waited for by name
          # alone, and a step that walked away before the editor answered
          # would call any answer a pass.
          $smoke = Start-Process `
            -FilePath "./smoke/${{ matrix.program }}" `
            -ArgumentList "--smoke" -Wait -PassThru -NoNewWindow
          if ($smoke.ExitCode -ne 0) { exit $smoke.ExitCode }

  # The formatters' own room, one machine: style is read the same way by
  # every system, so it is verified once rather than three times, on the
  # runner this repository has always measured it from.
  format:
    runs-on: windows-latest

    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Format
        run: dotnet format Shiranuix/Shiranuix.slnx --verify-no-changes

  # The rules the compiler cannot see. Small enough that it needs no build,
  # and exactly the checks that keep this repository's shape: no stray
  # carriage returns, no file past its line cap, and one version said one
  # way everywhere.
  guards:
    runs-on: windows-latest

    steps:
      - name: Keep line endings as they are in the repository
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: No carriage returns
        shell: pwsh
        run: |
          $bad = git ls-files |
            ForEach-Object {
              $bytes = [System.IO.File]::ReadAllBytes($_)
              # A file that is not text is left to itself, for its bytes are
              # the format's business, not line endings: an .ico, a picture,
              # any blob carries a 13 wherever compression happens to. What
              # carries no null byte is text, and text carries no carriage
              # return.
              if ($bytes -contains 0) { return }
              if ($bytes -contains 13) { $_ }
            }
          if ($bad) { $bad; exit 1 }
          "line endings clean"

      # A cap is a smell detector, not a law. Five hundred lines of one thing
      # - a class, a view, a test - reads better than three fragments of forty
      # lines each, which is what splitting for the sake of splitting leaves
      # behind. Past this number a file is worth a second look from a person.
      - name: Under the line caps
        shell: pwsh
        run: |
          $caps = @(
            @('Shiranuix/Shiranuix/*.cs', 500),
            @('Shiranuix/Shiranuix.CoreFormat/*.cs', 500),
            @('Shiranuix/Shiranuix.Tests/*.cs', 900),
            @('Shiranuix/Shiranuix.CoreFormat.Tests/*.cs', 900)
          )
          $over = foreach ($cap in $caps) {
            git ls-files $cap[0] |
              Where-Object { $_ -notmatch '\\obj\\|\\bin\\|Migrations\\|Compatibility\\' } |
              ForEach-Object {
                $lines = (Get-Content $_ | Measure-Object -Line).Lines
                if ($lines -gt $cap[1]) { [PSCustomObject]@{ File = $_; Lines = $lines } }
              }
          }
          if ($over) { $over; exit 1 }
          "caps respected"

      - name: One version everywhere
        shell: pwsh
        run: |
          $csproj = [regex]::Match(
            (Get-Content Shiranuix/Shiranuix/Shiranuix.csproj -Raw),
            '<Version>([\d.]+)</Version>').Groups[1].Value
          $app = git ls-files 'Shiranuix/Shiranuix/AppVersion.cs'
          $major = [regex]::Match(
            (Get-Content $app -Raw), 'public const int Major = (\d+);').Groups[1].Value
          $minor = [regex]::Match(
            (Get-Content $app -Raw), 'public const int Minor = (\d+);').Groups[1].Value
          $patch = [regex]::Match(
            (Get-Content $app -Raw), 'public const int Patch = (\d+);').Groups[1].Value
          $app = "$major.$minor.$patch"
          if ($csproj -ne $app) {
            "csproj says $csproj but AppVersion says $app"
            exit 1
          }
          "one version: $csproj"

# Central version catalog for the Shiranuix build.
# All dependency versions live here so they can be bumped in one place.

[versions]
javafx = "24.0.1"
junit = "5.12.2"
testfx = "4.0.18"
monocle = "21.0.2"
hamcrest = "3.0"

[libraries]
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
testfx-core = { module = "org.testfx:testfx-core", version.ref = "testfx" }
testfx-junit5 = { module = "org.testfx:testfx-junit5", version.ref = "testfx" }
monocle = { module = "org.testfx:openjfx-monocle", version.ref = "monocle" }

[plugins]
javafx = { id = "org.openjfx.javafxplugin", version = "0.1.0" }
